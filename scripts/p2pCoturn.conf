# coturn config for the P2P TURN fallback (VPNs / strict NATs where direct WebRTC can't connect).
# Credentials are minted by scripts/p2pRelayServer.mjs (GET /turn-credentials) with TURN_SHARED_SECRET.
#
# Setup (Debian/Ubuntu, same box as the relay):
#   1. apt-get install coturn
#   2. cp scripts/p2pCoturn.conf /etc/turnserver.conf and set static-auth-secret below
#      to the same value as TURN_SHARED_SECRET of the p2p-relay process
#   3. sed -i 's/#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn; systemctl enable --now coturn
#   4. Open 3478/udp, 3478/tcp and the relay range below in the firewall / provider security group
#   5. TURN_SHARED_SECRET=<same secret> pm2 restart p2p-relay --update-env
#
# No TLS (turns:) on purpose: keeps setup cert-free. Add tls-listening-port + cert/pkey if you need it
# for networks that only allow 443.

listening-port=3478
listening-ip=0.0.0.0
# external-ip=YOUR.PUBLIC.IP   # set if coturn can't detect it (NAT)

realm=p2p.mcraft.fun

use-auth-secret
static-auth-secret=REPLACE_ME_SAME_AS_TURN_SHARED_SECRET

no-tls
no-dtls

# Relay port range (avoid other services, e.g. LiveKit uses 50000-50100)
min-port=40000
max-port=49999

# Abuse/SSRF hardening: never relay to internal/private address ranges.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-multicast-peers
fingerprint
stale-nonce=600
total-quota=100
