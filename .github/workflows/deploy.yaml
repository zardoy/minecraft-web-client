name: Deploy Minecraft Web Client to Pages

on:
  push:
    branches: ["main"] 
  workflow_dispatch:   

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Cập nhật lên Node 24 để đồng bộ với hệ thống mới của GitHub

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        # Loại bỏ dòng khai báo "version: 9" để hệ thống tự động đọc bản 10.32.1 từ package.json

      - name: Cài đặt các thư viện phụ thuộc
        run: pnpm install --no-frozen-lockfile # Dùng lệnh này để tránh lỗi lệch cấu hình lockfile giữa các phiên bản

      - name: Biên dịch dự án (Build)
        run: pnpm build --base=/minecraft-web-client/

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên sản phẩm đã build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Phát hành lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
